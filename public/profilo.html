<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConcertApp - Il Mio Profilo</title>
  <link rel="stylesheet" href="/css/profilo.css">
</head>
<body>

  <div class="contenitore-profilo">
    
    <!--scheda informazioni utente -->
    <div class="scheda">
      <div class="intestazione-utente">
        <h2>AREA PERSONALE</h2>
        <button id="btn-logout" class="btn-logout"> DISCONNETTI</button>
      </div>
      <div class="info-riga"><strong>NOME:</strong> <span id="profilo-nome">-</span></div>
      <div class="info-riga"><strong>EMAIL:</strong> <span id="profilo-email">-</span></div>
      <a href="/trips.html" class="link-nuovo-viaggio">+ OFFRI NUOVO PASSAGGIO</a>
    </div>

    <!--elenco viaggi creati -->
    <div class="scheda">
      <h3>I MIEI VIAGGI PUBBLICATI </h3>
      <div id="contenitore-miei-viaggi" class="lista-viaggi">
        <p style="color: #94a3b8; font-size: 14px;">Caricamento viaggi in corso...</p>
      </div>
    </div>

  </div>

  <!--collegamento a profilojs--> 
  <script src="/js/profilo.js"></script>
</body>
</html>
