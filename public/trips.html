<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConcertApp - Offri un Passaggio</title>
  <link rel="stylesheet" href="/css/trips.css">
</head>
<body>

  <div class="scheda-viaggio">
    <h2> OFFRI UN PASSAGGIO </h2>

    <form id="form-crea-viaggio">
      
      <!--menu a tendina per scegliere il concerto --> 
      <div class="campo">
        <label for="scelta-concerto"> CONCERTO DI DESTINAZIONE </label>
        <input type="text" id="scelta-concerto" required placeholder="es.: Dua Lipa">
      </div>

      <!--città di partenza --> 
      <div class="campo">
        <label for="citta-partenza">CITTA' DI PARTENZA </label>
        <input type="text" id="citta-partenza" required placeholder="es.: Bari">
      </div>

      <!--orario di partenza -->
      <div class="campo">
        <label for="orario-partenza"> ORARIO DI PARTENZA </label>
        <input type="time" id="orario-partenza" required>
      </div>

      <!--posti liberi in auto--> 
      <div class="campo">
        <label for="posti-disponibili">POSTI DISPONIBILI</label>
        <input type="number" id="posti-disponibili" min="1" max="8" required placeholder="es.: 3">
      </div>

      <!-- contributo spese richiesto -->
      <div class="campo">
        <label for="prezzo-posto">PREZZO PER PASSEGGERO</label>
        <input type="number" id="prezzo-posto" min="0" step="0.5" required placeholder="es.: € 15">
      </div>

      <button type="submit">pubblica annuncio</button>
      <div id="messaggio-errore" class="messaggio-esito"></div>
    </form>

    <div class="link-ritorno">
      <a href="/profilo.html">&larr; Torna al mio profilo</a>
    </div>
  </div>

  <!--collegamento a trips.js--> 
  <script src="/js/trips.js"></script>
</body>
</html>
