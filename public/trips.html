<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConcertApp - Offri un Passaggio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .scheda-viaggio {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .campo {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #cbd5e1;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0369a1;
    }

    .messaggio-esito {
      color: #f87171;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }

    .link-ritorno {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
    }

    .link-ritorno a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="scheda-viaggio">
    <h2> OFFRI UN PASSAGGIO </h2>

    <form id="form-crea-viaggio">
      
      <!--menu a tendina per scegliere il concerto --> 
      <div class="campo">
        <label for="scelta-concerto"> CONCERTO DI DESTINAZIONE </label>
        <input type="text" id="scelta-concerto" required placeholder="es.: Dua Lipa">
      </div>

      <!--città di partenza --> 
      <div class="campo">
        <label for="citta-partenza">CITTA' DI PARTENZA </label>
        <input type="text" id="citta-partenza" required placeholder="es.: Bari">
      </div>

      <!--orario di partenza -->
      <div class="campo">
        <label for="orario-partenza"> ORARIO DI PARTENZA </label>
        <input type="time" id="orario-partenza" required>
      </div>

      <!--posti liberi in auto--> 
      <div class="campo">
        <label for="posti-disponibili">POSTI DISPONIBILI</label>
        <input type="number" id="posti-disponibili" min="1" max="8" required placeholder="es.: 3">
      </div>

      <!-- contributo spese richiesto -->
      <div class="campo">
        <label for="prezzo-posto">PREZZO PER PASSEGGERO</label>
        <input type="number" id="prezzo-posto" min="0" step="0.5" required placeholder="es.: € 15">
      </div>

      <button type="submit">pubblica annuncio</button>
      <div id="messaggio-errore" class="messaggio-esito"></div>
    </form>

    <div class="link-ritorno">
      <a href="/login.html">&larr; Torna alla schermata di Login</a>
    </div>
  </div>

  <!--collegamento a trips.js--> 
  <script src="/js/trips.js"></script>
</body>
</html>
