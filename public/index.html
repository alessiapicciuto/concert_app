<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConcertApp - Catalogo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Intestazione con menu utente dinamico -->
  <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 20px auto 15px auto; padding: 0 10px;">
    <h1 style="margin: 0; color: #38bdf8;">CATALOGO CONCERTI</h1>
    <div id="userMenu"></div>
  </div>

  <div style="max-width: 1000px; margin: 0 auto; padding: 0 10px;">
    <input type="text" id="search" class="search-box" placeholder="Cerca per città o genere..." oninput="filterData()">
    <div id="concertList" class="grid"></div>
  </div>

  <script>
    // --- 1. GESTIONE MENU UTENTE (LOGIN / TENDINA) ---
    const userMenu = document.getElementById('userMenu');
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));

    // Se l'utente è loggato, crea la tendina con il suo nome
    if (currentUser) {
      userMenu.innerHTML = `
        <div class="dropdown">
          <button onclick="toggleMenu(event)" class="dropdown-btn">
            Ciao, ${currentUser.name} ▼
          </button>
          <div id="dropdownMenu" class="dropdown-content">
            <a href="profilo.html">Area Personale</a>
            <a href="#" onclick="logout()">Esci</a>
          </div>
        </div>
      `;
    } 
    // Se non è loggato, mostra il pulsante di accesso
    else {
      userMenu.innerHTML = `
        <a href="login.html" class="dropdown-btn" style="text-decoration: none; display: inline-block;">
          Accedi / Registrati
        </a>
      `;
    }

    // Apre/Chiude il menu a tendina
    function toggleMenu(event) {
      event.stopPropagation();
      document.getElementById("dropdownMenu").classList.toggle("show");
    }

    // Disconnette l'utente
    function logout() {
      if (confirm('Sei sicuro di voler uscire?')) {
        localStorage.removeItem('currentUser');
        window.location.reload();
      }
    }

    // Chiude il menu se si clicca fuori dalla tendina
    window.onclick = function(event) {
      const dropdowns = document.getElementsByClassName("dropdown-content");
      for (let i = 0; i < dropdowns.length; i++) {
        const openDropdown = dropdowns[i];
        if (openDropdown.classList.contains('show')) {
          openDropdown.classList.remove('show');
        }
      }
    }

    // --- 2. GESTIONE CATALOGO CONCERTI ---
    let concerts = [];

    async function getConcerts() {
      try {
        const res = await fetch('/api/concerts');
        concerts = await res.json();
        render(concerts);
      } catch (err) {
        console.error('Errore nel caricamento dei concerti:', err);
        document.getElementById('concertList').innerHTML = '<p style="color:red;">Errore nel caricamento del catalogo.</p>';
      }
    }

    function render(list) {
      const container = document.getElementById('concertList');
      if (!list || list.length === 0) {
        container.innerHTML = '<p style="color: #aaa;">Nessun concerto trovato.</p>';
        return;
      }

      container.innerHTML = list.map(c => `
        <div class="card">
          <div>
            <h3>${c.title}</h3>
            <p><b>Luogo:</b> ${c.city} (${c.venue})</p>
            <p><b>Genere:</b> ${c.genre}</p>
            <p><b>Data:</b> ${c.date}</p>
          </div>
          <a href="concert.html?id=${c.id || c._id}" class="btn">Vedi Dettagli e Chat</a>
        </div>
      `).join('');
    }

    function filterData() {
      const query = document.getElementById('search').value.toLowerCase();
      render(concerts.filter(c => 
        (c.city && c.city.toLowerCase().includes(query)) || 
        (c.genre && c.genre.toLowerCase().includes(query)) ||
        (c.title && c.title.toLowerCase().includes(query))
      ));
    }

    getConcerts();
  </script>
</body>
</html>
