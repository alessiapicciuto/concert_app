<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Dettaglio & Chat</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <a href="index.html" class="back-link">← Torna al catalogo</a>
  
  <div id="detail" class="header-card"></div>
<div class="header-card" style="margin-top: 15px;">
  <h3 style="margin-top:0; color: #38bdf8;"> Viaggi e Passaggi Disponibili</h3>
  <div id="tripsList">
    <p style="color: #aaa;">Caricamento viaggi...</p>
  </div>
</div>
  
  <div class="chat-container">
    <h3 style="margin-top:0; color: #38bdf8;"> Chat di Gruppo</h3>
    <div id="chatBox" class="chat-box"></div>
    
    <div class="chat-input-group">
      <input type="text" id="msgText" placeholder="Scrivi un messaggio..." onkeyup="if(event.key === 'Enter') sendMsg()">
      <button onclick="sendMsg()">Invia</button>
    </div>
  </div>

  <script>
    const socket = io();
    const concertId = new URLSearchParams(window.location.search).get('id');
    const tripId = `trip_${concertId}`;

    const utenteSalvato = localStorage.getItem('currentUser');
    const utenteCorrente = utenteSalvato ? JSON.parse(utenteSalvato) : null;

    // Caricamento Dettagli Concerto e Messaggi Salvati
    fetch(`/api/concerts/${concertId}`)
      .then(res => res.json())
      .then(c => {
        document.getElementById('detail').innerHTML = `
          <h1>${c.title || c.artist}</h1>
          <p> <b>Luogo:</b> ${c.city} (${c.venue})</p>
          <p> <b>Data:</b> ${c.date} | <b>Genere:</b> ${c.genre}</p>
        `;

        // 1. MODIFICA: Mostra i messaggi salvati aggiungendo l'ID e il tasto Elimina
        if (c.messages && c.messages.length > 0) {
          const chatBox = document.getElementById('chatBox');
          chatBox.innerHTML = c.messages.map(m => {
            let deleteBtn = '';
            // Controlla se il messaggio è dell'utente corrente
            if (utenteCorrente && m.userName === utenteCorrente.name) {
              deleteBtn = `<button onclick="deleteMsg('${m.id}')" style="color: #ef4444; font-size: 12px; cursor: pointer; border: none; background: none; margin-left: 10px; font-weight: bold;">Elimina</button>`;
            }
            return `<p id="msg-${m.id}"><b style="color:#38bdf8">${m.userName}:</b> ${m.text} <span style="font-size:10px; color:#94a3b8;">(${m.time})</span> ${deleteBtn}</p>`;
          }).join('');
          chatBox.scrollTop = chatBox.scrollHeight;
        }

        fetch('/api/trips')
        .then(res => res.json())
        .then(trips => {
          const tit = (c.title || '').toLowerCase();
          const art = (c.artist || '').toLowerCase();

          const concertTrips = trips.filter(t => {
            if (t.concertId && String(t.concertId) === String(concertId)) return true;
            if (t.concertName) {
              const tripName = t.concertName.toLowerCase();
              return (tit && (tripName.includes(tit) || tit.includes(tripName))) ||
                     (art && (tripName.includes(art) || art.includes(tripName)));
            }
            return false;
          });

          const container = document.getElementById('tripsList');
          
          if (concertTrips.length === 0) {
            container.innerHTML = '<p style="color:#aaa;">Nessun passaggio ancora offerto per questo concerto.</p>';
            return;
          }

          container.innerHTML = concertTrips.map(t => {
            const citta = t.departureCity || t.fromCity || '-';
            const puntodiritiro=t.meetingPoint || 'Da concordare';
            const prezzo = t.pricePerSeat || t.price || 0;
            const posti = t.availableSeats !== undefined ? t.availableSeats : 0;
            const autista = t.driverName || 'Autista';

            const eAutista = utenteCorrente && String(t.driverId) === String(utenteCorrente.id);
            const giaPrenotato = utenteCorrente && t.passengers && t.passengers.some(p => String(p.userId) === String(utenteCorrente.id));

            let azioneHtml = '';
            if (eAutista) {
              azioneHtml = '<span style="color: #94a3b8; font-style: italic;">Tuo passaggio</span>';
            } else if (giaPrenotato) {
              azioneHtml = '<span style="color: #38bdf8; font-weight: bold;">Già Prenotato</span>';
            } else if (posti > 0) {
              azioneHtml = `<button onclick="prenotaPassaggio('${t.id}')" style="background-color: #059669; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">PRENOTA</button>`;
            } else {
              azioneHtml = '<span style="color: #f87171; font-weight: bold;">ESAURITO</span>';
            }

            return `
              <div style="border-bottom: 1px solid #333; padding: 10px 0; display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <p style="margin: 2px 0;"><b>Partenza da:</b> ${citta} | <b>In:</b> ${puntodiritiro} | <b>Autista:</b> ${autista}</p>
                  <p style="margin: 2px 0;"><b>Posti:</b> ${posti} | <b>Costo:</b> ${prezzo}€</p>
                </div>
                <div>
                  ${azioneHtml}
                </div>
              </div>
            `;
          }).join('');
        })
        .catch(() => {
          document.getElementById('tripsList').innerHTML = '<p style="color:#aaa;">Nessun passaggio ancora offerto per questo concerto.</p>';
        });
      });

    async function prenotaPassaggio(idViaggio) {
      if (!utenteCorrente) {
        alert('Effettua prima l\'accesso per prenotare un passaggio.');
        window.location.href = '/login.html';
        return;
      }

      try {
        const res = await fetch(`/api/trips/${idViaggio}/book`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: utenteCorrente.id,
            userName: utenteCorrente.name
          })
        });

        const data = await res.json();
        alert(data.message);

        if (res.ok) {
          window.location.href = '/profilo.html';
        }
      } catch (err) {
        alert('Errore durante la prenotazione.');
      }
    }

    socket.emit('join_trip', tripId);

    // 2. MODIFICA: Ricezione messaggi in tempo reale (include controllo per il tasto Elimina)
    socket.on('receive_message', data => {
      const chatBox = document.getElementById('chatBox');
      let deleteBtn = '';
      if (utenteCorrente && data.sender === utenteCorrente.name) {
        deleteBtn = `<button onclick="deleteMsg('${data.msgId}')" style="color: #ef4444; font-size: 12px; cursor: pointer; border: none; background: none; margin-left: 10px; font-weight: bold;">Elimina</button>`;
      }
      chatBox.innerHTML += `<p id="msg-${data.msgId}"><b style="color:#38bdf8">${data.sender}:</b> ${data.text} <span style="font-size:10px; color:#94a3b8;">(${data.time || ''})</span> ${deleteBtn}</p>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    // Invio del messaggio
    async function sendMsg() {
      if (!utenteCorrente) {
        alert('Effettua prima l\'accesso per partecipare alla chat.');
        window.location.href = '/login.html';
        return;
      }

      const input = document.getElementById('msgText');
      const text = input.value.trim();
      if (!text) return;
      
      const mittente = utenteCorrente.name;

      try {
        const res = await fetch(`/api/concerts/${concertId}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userName: mittente, text: text })
        });

        const data = await res.json();
        
        if (data.success) {
          const lastMsg = data.messages[data.messages.length - 1];
          // 3. MODIFICA: Emette anche l'ID del messaggio tramite socket
          socket.emit('send_message', { 
            tripId: tripId, 
            sender: mittente, 
            text: text,
            time: lastMsg.time,
            msgId: lastMsg.id 
          });

          input.value = '';
        }
      } catch (err) {
        console.error('Errore nell\'invio del messaggio', err);
      }
    }

    // 4. MODIFICA: Funzione per eliminare il messaggio e listener per farli sparire in tempo reale
    async function deleteMsg(msgId) {
      if (!confirm('Sei sicuro di voler eliminare questo messaggio?')) return;

      try {
        const res = await fetch(`/api/concerts/${concertId}/messages/${msgId}`, {
          method: 'DELETE'
        });
        const data = await res.json();

        if (data.success) {
          socket.emit('delete_message', { tripId: tripId, msgId: msgId });
          const msgElement = document.getElementById(`msg-${msgId}`);
          if (msgElement) msgElement.remove();
        }
      } catch (err) {
        console.error('Errore durante l\'eliminazione:', err);
      }
    }

    socket.on('message_deleted', (msgId) => {
      const msgElement = document.getElementById(`msg-${msgId}`);
      if (msgElement) msgElement.remove();
    });
  </script>
</body>
</html>
