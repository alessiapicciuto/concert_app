<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConcertApp - Accedi o Registrati</title>

  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Contenitore assoluto per "sganciare" il link dal centraggio di auth.css -->
  <div style="position: absolute; top: 25px; left: 0; width: 100%; display: flex; justify-content: center;">
    <div style="width: 100%; max-width: 1000px; padding: 0 15px;">
      <a href="index.html" class="back-link">← Torna al catalogo</a>
    </div>
  </div>



  <div class="scheda-autenticazione">
  
    <!--LOGIN -->
    <div id="sezione-login">
      <h2>ACCEDI</h2>
      <form id="form-login">
        <div class="campo">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="es.: mario.rossi@email.com">
        </div>

        <div class="campo">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="******">
        </div>

        <button type="submit">Entra</button>
        <div id="errore-login" class="messaggio-errore"></div>
      </form>

      <div class="testo-cambio">
        Non hai un account? <span id="passa-a-registrazione">Registrati</span>
      </div>
    </div>

    <!--REGISTRAZIONE --> 
    <div id="sezione-registrazione" class="hidden">
      <h2>REGISTRATI</h2>
      <form id="form-registrazione">
        <div class="campo">
          <label for="reg-nome"> Nome </label>
          <input type="text" id="reg-nome" required placeholder="es.: Mario Rossi">
        </div>

        <div class="campo">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" required placeholder="es.: mario.rossi@email.com">
        </div>

        <div class="campo">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required placeholder="la password deve avere almeno 6 caratteri">
        </div>

        <button type="submit"> crea Account</button>
        <div id="errore-registrazione" class="messaggio-errore"></div>
      </form>

      <div class="testo-cambio">
        Hai già un account? <span id="passa-a-login">Accedi</span>
      </div>
    </div>

  </div>

  <!--collegamento a auth.js -->
  <script src="/js/auth.js"></script>
</body>
</html>
